<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#050B25" />
  <title>MONETRIX INVEST — Deposit</title>
  <meta name="description" content="Fund your MONETRIX INVEST account securely." />
  <link rel="icon" href="assets/logo/logo.jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div data-include="components/navbar.html"></div>
  <main class="page container app-shell">
    <section class="page-intro">
      <div>
        <span class="eyebrow">Wallet funding</span>
        <h1>Deposit funds</h1>
        <p class="lead">Choose an amount and continue to Paystack’s secure checkout.</p>
      </div>
      <div class="intro-chip"><span class="status-dot"></span> Paystack checkout</div>
    </section>

    <section class="card deposit-card">
      <div class="section-heading">
        <div><span class="eyebrow"><span aria-hidden="true">💳</span> Secure payment</span><h2>Choose an amount</h2></div>
        <span class="status-pill">Minimum ₦1,000</span>
      </div>
      <form id="paystack-deposit-form" class="modern-form">
        <div class="form-field">
          <label for="deposit-email">Email address</label>
          <input type="email" id="deposit-email" value="monetrixinvesment9@gmail.com" autocomplete="email" required>
          <div class="field-help">Paystack will use this email for your payment.</div>
        </div>
        <div class="form-field">
          <label for="deposit-amount">Deposit amount (₦)</label>
          <div class="currency-input"><span>₦</span><input type="number" id="deposit-amount" min="1000" step="1" placeholder="1000" required></div>
          <div class="field-help">Minimum deposit: ₦1,000.</div>
        </div>
        <button class="btn primary btn-wide" id="start-deposit" type="submit"><span aria-hidden="true">🔒</span> Continue to secure checkout <span aria-hidden="true">→</span></button>
      </form>
      <div id="deposit-payment-status" class="note-panel hidden" role="status" aria-live="polite" style="margin-top:20px;">
        <p id="deposit-payment-message" class="muted"></p>
        <div id="deposit-payment-reference" class="muted"></div>
        <button id="verify-payment-status" class="btn ghost hidden" type="button" style="margin-top:14px;">Check payment status</button>
      </div>
    </section>
  </main>
  <div data-include="components/footer.html"></div>
  <script src="js/app.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/deposit.js"></script>
</body>
</html>
