<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#050B25" />
  <meta name="description" content="Manage your MONETRIX INVEST profile, referrals, and transaction history." />
  <link rel="icon" href="assets/logo/logo.jpeg" />
  <title>MONETRIX INVEST — Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div data-include="components/navbar.html"></div>
  <main class="page container">
    <section class="card profile-card">
      <span class="eyebrow">Your account</span><h1>Profile</h1>
      <div><strong>Full Name:</strong> <span id="profile-name"></span></div>
      <div><strong>Phone:</strong> <span id="profile-phone"></span></div>
      <div><strong>Wallet Balance:</strong> ₦<span id="profile-balance"></span></div>
      <div><strong>Referral Code:</strong> <span id="profile-ref-code"></span></div>
      <div><strong>Referral Link:</strong> <a id="profile-ref-link" href="#"></a></div>
      <div class="mt-2"><button class="btn outline" id="logout-btn">Logout</button></div>
    </section>
    <section class="card profile-card" id="transactions">
      <div class="section-heading"><div><span class="eyebrow">Account activity</span><h2>Transaction history</h2><p class="muted">A server-backed record of your deposits, withdrawals, rewards, and plan activity.</p></div></div>
      <div id="profile-transactions" class="transaction-list"><div class="loading-state"><span class="loader"></span> Loading transactions…</div></div>
    </section>
  </main>
  <div data-include="components/footer.html"></div>
  <script src="js/app.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
