<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050B25">
  <title>MONETRIX INVEST — Create account</title><meta name="description" content="Create your MONETRIX INVEST account."><link rel="icon" href="assets/logo/logo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/auth.css">
</head>
<body><div data-include="components/navbar.html"></div>
  <main class="page container auth-layout"><section class="card auth-card">
    <span class="eyebrow">Start your journey</span><h1>Create your account</h1><p class="muted">Set up your MONETRIX INVEST account and get a clear view of your investment journey.</p>
    <form id="register-form" class="auth-form"><label for="fullName">Full name<input type="text" id="fullName" autocomplete="name" placeholder="Your full name" required></label><label for="phone">Phone number<input type="tel" id="phone" inputmode="tel" autocomplete="tel" placeholder="08012345678" required></label><label for="password">Password<input type="password" id="password" autocomplete="new-password" placeholder="Create a secure password" minlength="6" required></label><label for="referralCode">Referral code <span class="optional">(optional)</span><input type="text" id="referralCode" placeholder="Enter a referral code"></label><div class="form-note">Your account details are secured by the platform’s authentication service.</div><button class="btn primary" type="submit">Create account <span>→</span></button></form>
    <div class="auth-helper"><span class="muted">Already have an account?</span><a href="login.html">Sign in</a></div>
  </section></main><div data-include="components/footer.html"></div>
  <script src="js/app.js"></script><script src="js/utils.js"></script><script src="js/toast.js"></script><script src="js/auth.js"></script>
</body></html>
